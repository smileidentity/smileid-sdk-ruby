name: e2e

on:
  push:
    branches:
      - main
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # Don't cancel a run already in flight: it may be mid-way through a live
  # sandbox verification, and cutting it off leaves an orphaned job.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'smileidentity/smileid-sdk-ruby'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run live e2e test
        env:
          SMILE_PARTNER_ID: ${{ secrets.SMILE_PARTNER_ID }}
          SMILE_API_KEY: ${{ secrets.SMILE_API_KEY }}
          SMILE_BASE_URL: ${{ secrets.SMILE_E2E_BASE_URL }}
        # rspec exits 0 for a skip (missing creds). strict.rb fails the run on
        # any pending example, or when no example ran.
        run: bundle exec rspec --no-color --require ./spec/e2e/strict spec/e2e/enhanced_kyc_e2e_spec.rb
