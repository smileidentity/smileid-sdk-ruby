name: e2e

on:
  push:
    branches:
      - main
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # Don't cancel a run already in flight: it may be mid-way through a live
  # sandbox verification, and cutting it off leaves an orphaned job.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'smileidentity/smileid-sdk-ruby'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run live e2e test
        env:
          SMILE_PARTNER_ID: ${{ secrets.SMILE_PARTNER_ID }}
          SMILE_API_KEY: ${{ secrets.SMILE_API_KEY }}
          SMILE_BASE_URL: ${{ secrets.SMILE_E2E_BASE_URL }}
        run: |
          set -o pipefail
          bundle exec rspec --no-color spec/e2e/enhanced_kyc_e2e_spec.rb | tee e2e_output.txt
          # rspec exits 0 even when the test skips (missing creds). Fail the
          # build unless the summary shows the tests actually ran and passed
          # with nothing pending.
          grep -qE '^[0-9]+ examples?, 0 failures$' e2e_output.txt
