name: test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

env:
  BUNDLE_FROZEN: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Due to https://github.com/actions/runner/issues/849, we have to use quotes for '3.0'
        # See https://www.ruby-lang.org/en/downloads/ for latest stable releases.
        ruby: ['3.0', '3.3']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rspec
    - name: Run example app tests
      working-directory: example
      env:
        # The example has no tracked lockfile; resolve it fresh.
        BUNDLE_FROZEN: "false"
      run: bundle install && bundle exec rspec
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9 # v1.325.0
      with:
        ruby-version: 3.3
        bundler-cache: true
    - name: Run RuboCop
      run: bundle exec rubocop --parallel
