name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One publish at a time per tag, so a re-pushed tag can't race itself on
# `gem push` or `gh release create`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard tag matches gem version
    if: github.repository == 'smileidentity/smileid-sdk-ruby'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, to find the previous release.
          fetch-depth: 0
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      # The tag must match SmileID::VERSION and have a dated CHANGELOG.md
      # heading. A release that contains a PR labelled `breaking` (merged
      # after the previous stable tag and before this one) needs a major
      # version, and a major version needs at least one such PR, except 0.x
      # to 1.0.0. Pull requests labelled `release` run the same script
      # before the tag is pushed.
      - name: Verify version, changelog and breaking PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release.sh "$GITHUB_REF_NAME"

  test:
    name: Test
    needs: guard
    uses: ./.github/workflows/test.yml

  release:
    name: Publish to RubyGems and create GitHub release
    needs: [guard, test]
    if: github.repository == 'smileidentity/smileid-sdk-ruby'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Build to a fixed filename so the push below names one exact file.
      # A `usesmileid-*.gem` glob would pass several arguments to `gem push`
      # if a second .gem ever landed in the workspace, or a literal
      # unexpanded filename if none did.
      - name: Build gem
        run: gem build usesmileid.gemspec -o usesmileid.gem

      # Trusted publishing exchanges this job's OIDC token for a short-lived
      # RubyGems.org push credential — no RUBYGEMS_API_KEY secret needed, as
      # long as a trusted publisher is configured on the gem before the tag
      # is pushed (see the PR description).
      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gem to RubyGems.org
        run: gem push usesmileid.gem

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
