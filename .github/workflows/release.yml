name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One publish at a time per tag, so a re-pushed tag can't race itself on
# `gem push` or `gh release create`.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard tag matches gem version
    if: github.repository == 'smileidentity/smileid-sdk-ruby'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false
      - name: Verify tag matches SmileID::VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GEM_VERSION="$(ruby -Ilib -e 'require "usesmileid/version"; puts SmileID::VERSION')"
          if [ "$TAG_VERSION" != "$GEM_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match lib/usesmileid/version.rb (SmileID::VERSION = $GEM_VERSION)"
            exit 1
          fi

  test:
    name: Test
    needs: guard
    uses: ./.github/workflows/test.yml

  release:
    name: Publish to RubyGems and create GitHub release
    needs: [guard, test]
    if: github.repository == 'smileidentity/smileid-sdk-ruby'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # Build to a fixed filename so the push below names one exact file.
      # A `usesmileid-*.gem` glob would pass several arguments to `gem push`
      # if a second .gem ever landed in the workspace, or a literal
      # unexpanded filename if none did.
      - name: Build gem
        run: gem build usesmileid.gemspec -o usesmileid.gem

      # Trusted publishing exchanges this job's OIDC token for a short-lived
      # RubyGems.org push credential — no RUBYGEMS_API_KEY secret needed, as
      # long as a trusted publisher is configured on the gem before the tag
      # is pushed (see the PR description).
      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gem to RubyGems.org
        run: gem push usesmileid.gem

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
