rules:
  - id: ruby-hardcoded-smile-credentials
    message: Do not hard-code Smile ID credentials; read them from environment variables or a secret manager.
    severity: ERROR
    languages:
      - ruby
    patterns:
      - pattern-either:
          - pattern: |
              SmileID::Client.new(..., api_key: "...", ...)
          - pattern: |
              SmileID::Client.new(..., partner_secret: "...", ...)
    metadata:
      category: security
      confidence: MEDIUM
